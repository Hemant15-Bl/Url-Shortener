apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: default
  labels:
    app: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: user-db
          image: mysql:8.0
          args:
            - "--innodb-flush-log-at-trx-commit=0" # 💡 Huge speedup: Don't flush to disk every second
            - "--innodb-doublewrite=0"            # 💡 Bypasses double buffer writes (safe for local dev)
            - "--innodb-buffer-pool-size=48M"     # 💡 Forces InnoDB engine to stay tiny
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: userUrl_DB
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_USER
              value: authUser
            - name: MYSQL_PASSWORD
              value: authPass
          resources:
            limits:
              memory: "384Mi"
              cpu: "400m"
            requests:
              memory: "256Mi"
              cpu: "150m"
          # NATIVE MYSQL HEALTH CHECK
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -proot
            initialDelaySeconds: 30 # Gives it runway to clear the init stage
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -proot
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: user-db-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: user-db-storage
          persistentVolumeClaim:
            claimName: user-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: default
spec:
  selector:
    app: user-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP