apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  namespace: default
  labels:
    app: apigateway-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway-service
  template:
    metadata:
      labels:
        app: apigateway-service
    spec:
      initContainers:
        - name: wait-for-discovery
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w2 discovery-service 8761; do echo waiting for discovery-service; sleep 3; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w2 redis 6379; do echo waiting for redis; sleep 3; done']
      containers:
        - name: apigateway-service
          image: hemantbarole/url-apigateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9096
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service:8761/eureka/

            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
              value: 200566460056-qlkqa2crgiottbur2dg8k5geq2fjn04q.apps.googleusercontent.com
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
              value: 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

            - name: APP_SECURITY_INTERNAL_HANDSHAKE_SECRET
              value: my-super-secret-key
            - name: SPRING_LAZY_INITIALIZATION
              value: "true"
            
            - name: EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS
              value: "30"
            - name: EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS
              value: "15"
            
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx160m -XX:+UseSerialGC -Xss512k -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
          resources:
            requests:
              memory: "180Mi"
              cpu: "50m"
            limits:
              memory: "320Mi"
              cpu: "300m"
          # STARTUP PROBE: Gives your app up to 2 minutes to boot on your 8GB laptop
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9096
            failureThreshold: 30
            periodSeconds: 5

          # LIVENESS PROBE: Runs continuously after startup passes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9096
            periodSeconds: 10
            timeoutSeconds: 2
          
          # READINESS PROBE: Controls traffic routing
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9096
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: apigateway-service
  ports:
    - protocol: TCP
      port: 9096
      targetPort: 9096
      nodePort: 30096
  type: NodePort