apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgs
  namespace: default
  labels:
    app: kgs
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kgs
  template:
    metadata:
      labels:
        app: kgs
    spec:
      containers:
        - name: kgs
          image: hemantbarole/url-key-generation:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9097
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service:8761/eureka/

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://kgs-db:3306/kgs_DB
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: org.hibernate.dialect.MySQL8Dialect

            - name: FLYWAY_ENABLED
              value: "true"
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"

            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
              value: 200566460056-qlkqa2crgiottbur2dg8k5geq2fjn04q.apps.googleusercontent.com
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
              value: 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
            - name: INTERNAL_SECRET
              value: my-super-secret-key

            - name: SPRING_LAZY_INITIALIZATION
              value: "true"
            - name: EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS
              value: "30"
            - name: EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS
              value: "15"
            
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx160m -XX:+UseSerialGC -Xss512k -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
          resources:
            requests:
              memory: "150Mi"
              cpu: "40m"
            limits:
              memory: "280Mi"
              cpu: "250m"
          # STARTUP PROBE: Gives your app up to 2 minutes to boot on your 8GB laptop
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9097
            failureThreshold: 30
            periodSeconds: 5

          # LIVENESS PROBE: Runs continuously after startup passes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9097
            periodSeconds: 10
            timeoutSeconds: 2
          
          # READINESS PROBE: Controls traffic routing
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9097
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kgs
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: kgs
  ports:
    - protocol: TCP
      port: 9097
      targetPort: 9097
  type: ClusterIP