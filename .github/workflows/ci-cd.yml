name: Build and Push to Docker Hub

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      discovery: ${{ steps.filter.outputs.discovery }}
      security: ${{ steps.filter.outputs.security }}
      gateway: ${{ steps.filter.outputs.gateway }}
      kgs: ${{ steps.filter.outputs.kgs }}
      url: ${{ steps.filter.outputs.url }}
      analytics: ${{ steps.filter.outputs.analytics }}
      user: ${{ steps.filter.outputs.user }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters:  |
            discovery: ['Backend/DiscoveryService/**']
            security: ['Backend/SecurityService/**']
            gateway: ['Backend/APIGateway/**']
            kgs: ['Backend/KeyGeneration/**']
            url: ['Backend/URLService/**']
            analytics: ['Backend/AnalyticsService/**']
            user: ['Backend/UserService/**']
            frontend: ['Frontend/url-shortener-ui/**']

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1   # ← forces matrix jobs to run sequentially, avoiding push races
      matrix:
        include:
          - { id: discovery, path: ./Backend/DiscoveryService, tag: url-discovery-service, manifest: k8s/core-services/discovery.yml, run: "${{ needs.changes.outputs.discovery }}" }
          - { id: security, path: ./Backend/SecurityService, tag: url-security-service, manifest: k8s/core-services/security.yml, run: "${{ needs.changes.outputs.security }}" }
          - { id: gateway, path: ./Backend/APIGateway, tag: url-apigateway-service, manifest: k8s/core-services/apigateway.yml, run: "${{ needs.changes.outputs.gateway }}" }
          - { id: kgs, path: ./Backend/KeyGeneration, tag: url-key-generation, manifest: k8s/core-services/kgs.yml, run: "${{ needs.changes.outputs.kgs }}" } 
          - { id: url, path: ./Backend/URLService, tag: url-urlservice, manifest: k8s/core-services/url.yml, run: "${{ needs.changes.outputs.url }}" }
          - { id: user, path: ./Backend/UserService, tag: url-user-service, manifest: k8s/core-services/user.yml, run: "${{ needs.changes.outputs.user }}" }
          - { id: analytics, path: ./Backend/AnalyticsService, tag: url-analytics-service, manifest: k8s/core-services/analytics.yml, run: "${{ needs.changes.outputs.analytics }}" }
          - { id: frontend, path: ./Frontend/url-shortener-ui, tag: url-shortener-ui, manifest: k8s/core-services/frontend.yml, run: "${{ needs.changes.outputs.frontend }}" }

    steps:
      - name: check for changes
        if: matrix.run != 'true'
        run: echo "No Changes for ${{ matrix.id }}, skiping..."
      
      - name: check code
        if: matrix.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: set up JDK 17
        if: matrix.run == 'true' && matrix.id != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Log In to Docker Hub
        if: matrix.run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build All Jar's (Java only)
        if: matrix.run == 'true' && matrix.id != 'frontend'
        run: |
          # 1. Always install the shared library dependency to the local runner's .m2 cache
          echo "Installing shared SecurityService library dependency..."
          mvn clean install -DskipTests -f ./Backend/SecurityService/pom.xml
          
          # 2. Now build the targeted microservice matrix item cleanly
          echo "Building target service: ${{ matrix.id }}..."
          mvn clean package -DskipTests -f ${{ matrix.path }}/pom.xml

      - name: Set image tag
        if: matrix.run == 'true'
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Build and Push Image
        if: matrix.run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: true
          build-args: |
            REACT_APP_API_BASE_URL=http://localhost:30096
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.tag }}:${{ steps.vars.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.tag }}:latest
      
      - name: Update manifest with new image tag
        if: matrix.run == 'true'
        run: |
          sed -i "s|image: .*${{ matrix.tag }}:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.tag }}:${{ steps.vars.outputs.sha }}|" ${{ matrix.manifest }}

      - name: Commit and push manifest change
        if: matrix.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ matrix.manifest }}
          git diff --staged --quiet || git commit -m "chore: deploy ${{ matrix.id }} @ ${{ steps.vars.outputs.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main